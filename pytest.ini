[pytest]
addopts = --cov=src --cov=tests --cov-report=html --cov-report=term
testpaths = tests
markers =
	slow: marks tests as slow (deselect with '-m "not slow"')
	heavy: RAM-dependent simulations (opt-in with --run-heavy or env)
	integration: exercises SDK/backends or external services
	unit: fast logic-only coverage
	resource_only: analysis-only tests (Stage 0/1) without execution
	out_of_scope: explicitly skipped cases per project scope