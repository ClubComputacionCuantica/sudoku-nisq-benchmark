[pytest]
addopts = --cov=tests --cov-report=html --cov-report=term
testpaths = tests
markers =
	slow: marks tests as slow (deselect with '-m "not slow"')
	resource_only: analysis-only tests (Stage 0/1) without execution
	heavy: RAM-dependent simulations (opt-in with --run-heavy or env)
	out_of_scope: explicitly skipped cases per project scope