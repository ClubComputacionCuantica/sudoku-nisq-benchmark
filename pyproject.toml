[project]
name = "sudoku-nisq-benchmark"
version = "0.1.0"
description = "Framework designed to demonstrate how Sudoku puzzles can serve as a accessible benchmarking problems for near-term quantum computers."
authors = [
    {name = "Club de Computacion Cuantica"}
]
license = {text = "Apache 2.0"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytket (>=2.7.0,<3.0.0)",
    "pytket-qiskit (>=0.69.0,<0.70.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "py-sudoku (>=2.0.0,<3.0.0)",
    "sudoku-py (>=1.0.0,<2.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pytket-quantinuum (>=0.52.0,<0.53.0)",
    "amazon-braket-sdk (>=1.104.1,<2.0.0)",
    "linkify-it-py (>=2.0.3,<3.0.0)",
    "boto3 (>=1.41.0,<2.0.0)",
    "mitiq (>=0.48.1,<0.49.0)"
]

[tool.poetry]
name = "sudoku-nisq-benchmark"
version = "0.1.0"
description = "Framework designed to demonstrate how Sudoku puzzles can serve as a accessible benchmarking problems for near-term quantum computers."
authors = ["Club de Computacion Cuantica"]
packages = [
  { include = "sudoku_nisq", from = "src" }
]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
ruff = "^0.12.3"
pytest = "^8.4.1"
mypy = "^1.16.1"
pytest-cov = "^6.2.1"
psutil = "^7.0.0"
sphinx = "^7.2.0"
myst-parser = "^2.0.0"
furo = "^2024.8.6"
sphinx-autodoc-typehints = "^2.0.0"
sphinx-autobuild = "^2024.2.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = ["tests/"]

[tool.mypy]
ignore_missing_imports = true
strict = false